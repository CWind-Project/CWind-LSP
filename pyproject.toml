[project]
name = "cwind-lsp"
version = "0.0.1"
description = "Language Server Protocol implementation for the CWind language"
authors = [
    {name = "星灿长风v", email = "starwindv.stv@google.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygls (>=2.1.1,<3.0.0)",
    "lsprotocol (>=2025.0.0,<2026.0.0)",
    "pytest-lsp (>=1.0.1,<2.0.0)",
]

[project.scripts]
cwind-lsp = "cwind_lsp.__main__:main"

[dependency-groups]
dev = [
    "pytest (>=9.0.0,<10.0.0)",
    "pytest-asyncio (>=1.0.0,<2.0.0)",
    "pytest-xdist (>=3.5,<4.0)",
]

[tool.poetry]
packages = [{include = "cwind_lsp", from = "src"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
